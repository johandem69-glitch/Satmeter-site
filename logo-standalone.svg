<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Satmeter">
  <defs>
    <linearGradient id="sm-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb454"/>
      <stop offset="55%" stop-color="#f7931a"/>
      <stop offset="100%" stop-color="#e07d05"/>
    </linearGradient>
  </defs>
  <circle cx="20" cy="20" r="19" fill="url(#sm-g)"/>
  <!-- gauge arc: the "meter" in Satmeter -->
  <path d="M9.5 25.5 A11.5 11.5 0 0 1 30.5 25.5" fill="none" stroke="#fff" stroke-opacity=".55"
        stroke-width="2.4" stroke-linecap="round"/>
  <!-- needle pointing up-right, as if reading high -->
  <line x1="20" y1="25.5" x2="27" y2="14.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="20" cy="25.5" r="2.6" fill="#fff"/>
  <!-- bitcoin mark -->
  <text x="20" y="14.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"
        fill="#fff" text-anchor="middle" opacity=".92">₿</text>
</svg>
